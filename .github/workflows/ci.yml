name: Monorepo CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Tầng Bảo mật: Sử dụng Trivy scanner để quét toàn bộ mã nguồn
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: 0 # Tạm thời để 0 (cảnh báo) để không chặn Build ngay lập tức
          severity: 'CRITICAL,HIGH'

  backend-ci:
    name: Backend Node.js Check
    runs-on: ubuntu-latest
    needs: [security-scan]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build Check (Syntax)
        run: node -c server.js


  frontend-ci:
    name: Frontend Expo Check
    runs-on: ubuntu-latest
    needs: [security-scan]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Application (Expo Export)
        run: npx expo export
