name: IELTS App CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          cd backend
          npm install
      - name: Prisma Generate
        run: |
          cd backend
          npx prisma generate
      # - name: Run Lint
      #   run: |
      #     cd backend
      #     npm run lint

      - name: Build Check
        run: |
          cd backend
          # Với Express, bước "build" chính là đảm bảo Prisma và dependencies ổn định
          node -c src/server.js 

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Build Check
        run: |
          cd frontend
          npx expo export

