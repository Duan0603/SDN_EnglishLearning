version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ielts_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ielts_app}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: ielts_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ielts_app}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
    depends_on:
      - db

  adminer:
    image: adminer
    container_name: ielts_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
