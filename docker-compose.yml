services:
  # ============================================================
  # Database: MongoDB (Replica Set — required for Prisma ORM)
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: ielts_mongodb
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Worker: Initialize MongoDB Replica Set + Admin User
  mongodb-init:
    image: mongo:7.0
    container_name: ielts_mongodb_init
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        echo "Configuring MongoDB Replica Set..."
        mongosh --host mongodb:27017 --eval "
          try {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
            print('Replica Set initiated');
          } catch (e) {
            print('Replica Set already exists: ' + e);
          }

          sleep(5000);

          try {
            var userExists = db.getSiblingDB('admin').getUser('${MONGO_USER}');
            if (!userExists) {
              db.getSiblingDB('admin').createUser({
                user: '${MONGO_USER}',
                pwd: '${MONGO_PASS}',
                roles: [{ role: 'root', db: 'admin' }]
              });
              print('Admin user created');
            } else {
              print('Admin user already exists');
            }
          } catch (e) {
            print('Error creating user: ' + e);
          }
        "
    depends_on:
      mongodb:
        condition: service_healthy

  # ============================================================
  # Cache & Lock Layer: Redis
  # Architecture: Used ONLY for booking concurrency locking (Epic 4)
  # Pattern: SETNX + Lua Script + TTL for deadlock prevention
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: ielts_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ============================================================
  # MongoDB GUI (Development only)
  # ============================================================
  mongo-express:
    image: mongo-express:latest
    container_name: ielts_mongo_express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/${MONGO_DB:-ielts_app}?authSource=admin&directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully

  # ============================================================
  # Backend API (for production Docker deployment)
  # Development: Run `npm run dev` in backend/ directly
  # ============================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ielts_api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/${MONGO_DB:-ielts_app}?authSource=admin&replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
