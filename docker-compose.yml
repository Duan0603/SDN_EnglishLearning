services:
  # Database: MongoDB
  mongodb:
    image: mongo:latest
    container_name: ielts_mongodb
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Worker: Tự động khởi tạo Replica Set VÀ Tạo User
  mongodb-init:
    image: mongo:latest
    container_name: ielts_mongodb_init
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        sleep 5
        echo "Đang cấu hình MongoDB..."
        mongosh --host mongodb:27017 --eval "
          // 1. Khởi tạo Replica Set nếu chưa có
          try {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
            print('Đã gửi lệnh khởi tạo Replica Set');
          } catch (e) {
            print('Replica Set đã tồn tại');
          }
          
          // Đợi một chút để RS ổn định
          sleep(5000);

          // 2. Tạo User Admin (Chỉ tạo nếu chưa có)
          try {
            var userCount = db.getSiblingDB('admin').getUser('${MONGO_USER:-admin}');
            if (!userCount) {
              db.getSiblingDB('admin').createUser({
                user: '${MONGO_USER:-admin}',
                pwd: '${MONGO_PASS:-password}',
                roles: [{ role: 'root', db: 'admin' }]
              });
              print('Đã tạo User thành công');
            } else {
              print('User đã tồn tại');
            }
          } catch (e) {
            print('Lỗi khi kiểm tra/tạo User: ' + e);
          }
        "
    depends_on:
      mongodb:
        condition: service_healthy

  # MongoDB GUI
  mongo-express:
    image: mongo-express:latest
    container_name: ielts_mongo_express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-password}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASS:-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-password}@mongodb:27017/${MONGO_DB:-ielts_app}?authSource=admin&directConnection=true
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully

  # Backend API
  api:
    build:
      context: ./backend
    container_name: ielts_api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-password}@mongodb:27017/${MONGO_DB:-ielts_app}?authSource=admin&directConnection=true
      - JWT_SECRET=your_jwt_secret_here
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully

volumes:
  mongodb_data:
